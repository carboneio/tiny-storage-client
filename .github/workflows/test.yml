name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Every version of the range declared in the "engines" field of package.json,
      # up to the current release. Node 26 is the version used to publish on npm.
      matrix:
        node-version: [20.x, 22.x, 24.x, 26.x]
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Lint
        if: startsWith(matrix.node-version, '26')
        run: npm run lint:check

      # Only the shipped dependencies, and only high or critical: dev tools never reach users
      - name: Audit production dependencies
        if: startsWith(matrix.node-version, '26')
        run: npm audit --omit=dev --audit-level=high
